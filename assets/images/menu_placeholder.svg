<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF6E3"/>
      <stop offset="50%" stop-color="#FEF3C7"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Maroon Gradient -->
    <linearGradient id="maroonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7F1D1D"/>
      <stop offset="100%" stop-color="#5C0A14"/>
    </linearGradient>
  </defs>

  <!-- Background Rect -->
  <rect width="400" height="300" rx="16" fill="url(#bgGrad)"/>

  <!-- Subtle Corner Borders (Chinese Grid / Frame) -->
  <rect x="12" y="12" width="376" height="276" rx="12" fill="none" stroke="#D97706" stroke-width="1.5" stroke-opacity="0.35" stroke-dasharray="6,4"/>
  <rect x="18" y="18" width="364" height="264" rx="8" fill="none" stroke="#7F1D1D" stroke-width="1" stroke-opacity="0.15"/>

  <!-- Steam Waves (Rising from bowl) -->
  <g opacity="0.65">
    <path d="M 175 110 Q 180 90 175 70 T 175 30" fill="none" stroke="#D97706" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
    <path d="M 200 105 Q 207 85 200 65 T 200 25" fill="none" stroke="#D97706" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <path d="M 225 110 Q 230 90 225 70 T 225 30" fill="none" stroke="#D97706" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- Central Noodle / Dimsum Bowl Illustration -->
  <!-- Bowl Shadows -->
  <ellipse cx="200" cy="225" rx="75" ry="12" fill="#5C0A14" opacity="0.12"/>

  <!-- Bowl Base -->
  <path d="M 150 185 C 150 225, 250 225, 250 185 Z" fill="url(#maroonGrad)"/>
  <!-- Bowl Foot -->
  <rect x="180" y="215" width="40" height="8" rx="2" fill="url(#goldGrad)"/>

  <!-- Bowl Rim -->
  <ellipse cx="200" cy="185" rx="52" ry="12" fill="#FEF3C7" stroke="url(#goldGrad)" stroke-width="3"/>
  <ellipse cx="200" cy="185" rx="46" ry="9" fill="url(#goldGrad)" opacity="0.3"/>

  <!-- Chopsticks -->
  <line x1="140" y1="130" x2="230" y2="180" stroke="#7F1D1D" stroke-width="4" stroke-linecap="round"/>
  <line x1="150" y1="120" x2="235" y2="175" stroke="#D97706" stroke-width="3" stroke-linecap="round"/>

  <!-- Decorative Chinese Lanterns at top corners -->
  <!-- Left Lantern -->
  <g transform="translate(45, 28)">
    <line x1="15" y1="0" x2="15" y2="12" stroke="#D97706" stroke-width="1.5"/>
    <rect x="7" y="12" width="16" height="5" rx="1" fill="url(#goldGrad)"/>
    <path d="M 5 17 Q 0 32 5 47 L 25 47 Q 30 32 25 17 Z" fill="url(#maroonGrad)" stroke="url(#goldGrad)" stroke-width="1"/>
    <rect x="7" y="47" width="16" height="5" rx="1" fill="url(#goldGrad)"/>
    <line x1="15" y1="52" x2="15" y2="64" stroke="#D97706" stroke-width="1.5"/>
  </g>

  <!-- Right Lantern -->
  <g transform="translate(325, 28)">
    <line x1="15" y1="0" x2="15" y2="12" stroke="#D97706" stroke-width="1.5"/>
    <rect x="7" y="12" width="16" height="5" rx="1" fill="url(#goldGrad)"/>
    <path d="M 5 17 Q 0 32 5 47 L 25 47 Q 30 32 25 17 Z" fill="url(#maroonGrad)" stroke="url(#goldGrad)" stroke-width="1"/>
    <rect x="7" y="47" width="16" height="5" rx="1" fill="url(#goldGrad)"/>
    <line x1="15" y1="52" x2="15" y2="64" stroke="#D97706" stroke-width="1.5"/>
  </g>

  <!-- Watermark Text / Brand Title -->
  <text x="200" y="258" font-family="serif" font-size="15" font-weight="bold" fill="#7F1D1D" letter-spacing="3" text-anchor="middle" opacity="0.8">
    BINGNONDO
  </text>
  <text x="200" y="274" font-family="sans-serif" font-size="10" fill="#78350F" letter-spacing="1" text-anchor="middle" opacity="0.65">
    AUTHENTIC CAFE
  </text>
</svg>
