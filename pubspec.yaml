name: bingnondo_app
description: "Bingnondo Cafe — Mobile Food Ordering App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # HTTP client
  http: ^1.2.1

  # Secure local storage for tokens
  flutter_secure_storage: ^9.2.2

  # Shared preferences (non-sensitive prefs)
  shared_preferences: ^2.3.2

  # Navigation
  go_router: ^14.2.7

  # State management
  provider: ^6.1.2

  # Form validation
  flutter_form_builder: ^10.3.0+2
  form_builder_validators: ^11.0.0

  # PIN / OTP input
  pin_code_fields: ^8.0.1

  # Loading animation
  loading_animation_widget: ^1.2.0+4

  # Google fonts
  google_fonts: ^6.2.1

  # SVG support
  flutter_svg: ^2.0.10+1

  # Shimmer loading
  shimmer: ^3.0.0

  # Haptic feedback helper
  vibration: ^3.2.1

  # Real-time menu availability updates via Socket.io
  # Used for §1.3 live is_available badge changes pushed from backend
  socket_io_client: ^3.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/